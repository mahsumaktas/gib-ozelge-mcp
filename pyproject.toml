[project]
name = "gib-ozelge-mcp"
version = "0.1.0"
description = "GIB (Gelir Idaresi Baskanligi) ozelge arama MCP sunucusu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # SDK v2 stable 2026-07-27'de cikiyor (breaking); resmi oneri ust sinir pinleme
    "mcp>=1.27,<2",
    "httpx>=0.27.0",
]

[project.scripts]
gib-ozelge-mcp = "gib_ozelge_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gib_ozelge_mcp"]

[tool.pytest.ini_options]
markers = [
    "live: canli GIB API'sine istek atan testler (varsayilan calisir, -m 'not live' ile atlanir)",
]
